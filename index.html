<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planyet — Experience Design Studio</title>
<meta name="description" content="Planyet is an experience design studio. We plan and execute curated real-world experiences — romantic dates, proposals, anniversaries, celebrations and corporate events.">
<link rel="icon" type="image/png" href="assets/planyet-logo-red.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Process.jsx"></script>
<script type="text/babel" src="About.jsx"></script>
<script type="text/babel" src="Dropdown.jsx"></script>
<script type="text/babel" src="Enquiry.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>

<script type="text/babel">
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "heroTheme": "cream",
    "heroEyebrow": "Experience Design Co.",
    "heroLine": "Some moments deserve",
    "heroHot": "more than a memory.",
    "heroSub": "We step in before the moment happens, so all you have to do is feel it.",
    "heroCta": "Make your moment happen"
  }/*EDITMODE-END*/;

  function App() {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    useReveal();
    return (
      <React.Fragment>
        <Nav />
        <Hero t={t} />
        <Process />
        <About />
        <Enquiry />
        <Footer />

        <TweaksPanel>
          <TweakSection label="Hero direction" />
          <TweakRadio label="Layout" value={t.heroTheme}
                      options={['cream', 'red', 'split']}
                      onChange={(v) => setTweak('heroTheme', v)} />
          <TweakSection label="Hero copy" />
          <TweakText label="Eyebrow" value={t.heroEyebrow}
                     onChange={(v) => setTweak('heroEyebrow', v)} />
          <TweakText label="Headline" value={t.heroLine}
                     onChange={(v) => setTweak('heroLine', v)} />
          <TweakText label="Accent words" value={t.heroHot}
                     onChange={(v) => setTweak('heroHot', v)} />
          <TweakText label="Sub-line" value={t.heroSub}
                     onChange={(v) => setTweak('heroSub', v)} />
          <TweakText label="Button" value={t.heroCta}
                     onChange={(v) => setTweak('heroCta', v)} />
        </TweaksPanel>
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
