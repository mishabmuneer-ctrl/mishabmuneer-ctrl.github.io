<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planyet | Coming Soon</title>
    <style>
        /* Modern Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff; /* Pure white background */
            color: #0f172a; /* Deep slate text for high contrast readability */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
            padding: 24px;
        }

        /* 🌀 MINIMALIST LOADING SCREEN */
        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 2px solid #f1f5f9; /* Subtle light gray ring */
            border-radius: 50%;
            border-top-color: #0f172a; /* Deep dark spinning accent */
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* 🧱 CONTENT LAYOUT */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 400px;
            width: 100%;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 🔳 SQUARE LOGO CONFIGURATION */
        .logo-wrapper {
            width: 100%;
            max-width: 160px; /* Perfect sizing for a balanced square presentation */
            aspect-ratio: 1 / 1; /* Guarantees a flawless square bounding box */
            margin-bottom: 32px;
            display: flex;
            justify-content: center;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Ensures the square logo never stretches */
            /* Optional: uncomment the line below if you want soft rounded corners on your logo */
            /* border-radius: 12px; */
        }

        /* ✍️ TYPOGRAPHY & BRANDING */
        .status-badge {
            background-color: #f1f5f9; /* Ultra-light clean gray badge */
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #475569; /* Slate gray text */
            margin-bottom: 24px;
            font-weight: 600;
        }

        h1 {
            font-size: 1.85rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #0f172a;
            margin-bottom: 12px;
        }

        p {
            font-size: 0.95rem;
            color: #64748b; /* Muted corporate text gray */
            line-height: 1.6;
            max-width: 320px;
        }

        /* 📱 MOBILE RESPONSIVE TWEAKS */
        @media (max-width: 768px) {
            .logo-wrapper {
                max-width: 130px; /* Adapts size slightly down for smaller iPhone displays */
                margin-bottom: 24px;
            }
            h1 {
                font-size: 1.6rem;
            }
            p {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div id="loader-wrapper">
        <div class="spinner"></div>
    </div>

    <div class="container">
        <div class="status-badge">Under Construction</div>
        
        <div class="logo-wrapper">
            <img src="planyet-logosquare" alt="Planyet Logo">
        </div>

        <h1>Something new is cooking</h1>
        <p>We are currently hard at work building the ultimate experience. We'll be ready to launch very soon.</p>
    </div>

    <script>
        window.addEventListener('load', function() {
            const loader = document.getElementById('loader-wrapper');
            setTimeout(() => {
                loader.classList.add('fade-out');
            }, 350); // Snappy, premium transition delay
        });
    </script>

</body>
</html>
