<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planyet</title>
    <style>
        /* Setup the core workspace background */
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a; /* Sleek, dark modern backdrop */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        /* 💻 LAPTOP / DESKTOP VIEW */
        @media (min-width: 769px) {
            img {
                max-height: 90vh; /* Prevents the image from spilling off the screen top/bottom */
                width: auto;      /* Keeps the original aspect ratio crisp */
                object-fit: contain;
                border-radius: 16px;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); /* Elegant floating effect */
                border: 1px solid rgba(255, 255, 255, 0.05);
            }
        }

        /* 📱 IPHONE / MOBILE VIEW */
        @media (max-width: 768px) {
            img {
                width: 100%;
                height: 100%;
                object-fit: cover; /* Crops subtly on the edges if needed to fill portrait screens perfectly */
                border-radius: 0px;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <img src="planyet-cover.jpg" alt="Planyet">
    </div>

</body>
</html>
