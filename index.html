/* ============================================================
   PLANYET — Colors & Type
   Experience Design Studio · planyet.in
   Source of truth: live site (mishabmuneer-ctrl.github.io)
   + uploaded color-system poster.
   ============================================================ */

/* Fonts — load once in the <head> of any page:
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

   TYPE DIRECTION: "Poster" — Oswald (condensed, heavy, set UPPERCASE for headlines) +
   Hanken Grotesk (warm, quiet grotesque for body/UI). Oswald gives the poster-style
   tagline lockups their impact while staying a touch slimmer and more legible than a
   heavyweight like Anton; the emotional clause is carried in RED, never italics.
   Hanken Grotesk keeps everything functional and warm.
*/

:root {
  /* ---------- BRAND COLOR ---------- */
  --red:        #E8473F;  /* Planyet Red — logo, CTA, accents, headings (live site) */
  --red-dark:   #C73B34;  /* hover / pressed state for red surfaces            */
  --red-pale:   #FDF0EF;  /* tinted background, selected rows, success ring    */

  /* Red tint scale (from color-system poster) */
  --red-100:    #FDE8E6;
  --red-200:    #F8B3AE;
  --red-300:    #F28078;
  --red-400:    #ED5B4F;
  --red-500:    #E8392A;  /* poster's pure "Planyet Red" — interchangeable w/ --red */

  /* ---------- NEUTRALS ---------- */
  --cream:      #F5F1E6;  /* page & hero background                            */
  --cream-dark: #EDE8D8;  /* cards on cream, section dividers                  */
  --white:      #FFFFFF;  /* form cards, elevated surfaces                     */

  --ink:        #18120F;  /* primary body text, dark surfaces                  */
  --ink-mid:    #4A3B34;  /* secondary headings / strong body                 */
  --ink-muted:  #8A7570;  /* captions, labels, placeholders, footnotes        */
  --smoke:      #6B6B6B;  /* neutral supporting text (poster)                 */

  /* hairlines & input chrome */
  --line:       #ECDDD8;  /* card borders                                     */
  --line-input: #E4D9D4;  /* input borders                                    */
  --placeholder:#C0AEAA;  /* input placeholder text                           */

  /* ---------- SEMANTIC ROLES ---------- */
  --bg:            var(--cream);
  --bg-card:       var(--white);
  --bg-section:    var(--cream-dark);
  --bg-invert:     var(--red);       /* hero / left panel               */
  --fg:            var(--ink);
  --fg-2:          var(--ink-muted);
  --fg-on-red:     #FFFFFF;
  --fg-on-red-2:   rgba(255,255,255,0.75);
  --accent:        var(--red);

  /* ---------- TYPE FAMILIES ---------- */
  --display: 'Oswald', 'Arial Narrow', sans-serif;      /* hero / headlines — condensed bold, set UPPERCASE */
  --serif:   var(--display);                            /* legacy alias — headings now use Oswald */
  --sans:    'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; /* body / UI / labels / buttons */

  /* ---------- TYPE SCALE (fluid where it matters) ---------- */
  --fs-display:  clamp(54px, 6.5vw, 98px); /* hero headline (Oswald condensed — set it big) */
  --fs-h1:       clamp(34px, 4vw, 56px);   /* section heading (Oswald uppercase) */
  --fs-h2:       24px;                      /* card / sub heading      */
  --fs-h3:       18px;
  --fs-body:     15px;                      /* default body            */
  --fs-body-lg:  17px;
  --fs-small:    14px;
  --fs-label:    11px;                      /* uppercase eyebrow/label */
  --fs-micro:    12px;

  /* ---------- WEIGHTS ---------- */
  --w-light:  300;
  --w-reg:    400;
  --w-med:    500;
  --w-bold:   700;

  /* ---------- TRACKING ---------- */
  --track-eyebrow: 0.18em; /* uppercase eyebrows / tags */
  --track-label:   0.08em; /* uppercase field labels    */
  --track-tight:   0.02em;

  /* ---------- RADII ---------- */
  --r-sm:    10px;  /* inputs, buttons        */
  --r-md:    12px;  /* dropdown menus         */
  --r-lg:    20px;  /* form cards             */
  --r-pill:  100px; /* tags, pills, chips     */

  /* ---------- SHADOWS ---------- */
  --shadow-card: 0 -8px 32px rgba(26,20,16,0.10); /* dropdown / floating */
  --shadow-soft: 0 8px 28px rgba(26,20,16,0.06);

  /* ---------- SPACING (4px base) ---------- */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 14px;
  --sp-4: 18px;
  --sp-5: 24px;
  --sp-6: 32px;
  --sp-7: 48px;
  --sp-8: 64px;

  /* ---------- MOTION ---------- */
  --ease:      cubic-bezier(0.22, 0.61, 0.36, 1);
  --dur-fast:  0.15s;
  --dur:       0.2s;
  --dur-slow:  0.8s;
}

/* ============================================================
   SEMANTIC ELEMENT DEFAULTS
   Apply by adding the class, or copy into your reset.
   ============================================================ */

.pl-display {
  font-family: var(--display);
  font-weight: 700;
  text-transform: uppercase;
  font-size: var(--fs-display);
  line-height: 1;
  letter-spacing: 0.01em;
  color: var(--ink);
}
.pl-display em { font-style: normal; color: var(--red); }

.pl-h1 {
  font-family: var(--display);
  font-weight: 700;
  text-transform: uppercase;
  font-size: var(--fs-h1);
  line-height: 1.02;
  letter-spacing: 0.01em;
  color: var(--ink);
}
.pl-h1 em { font-style: normal; color: var(--red); }

.pl-h2 {
  font-family: var(--display);
  font-weight: 700;
  text-transform: uppercase;
  font-size: var(--fs-h2);
  line-height: 1.1;
  letter-spacing: 0.01em;
  color: var(--ink);
}

.pl-eyebrow {
  font-family: var(--sans);
  font-weight: var(--w-med);
  font-size: var(--fs-label);
  letter-spacing: var(--track-eyebrow);
  text-transform: uppercase;
  color: var(--red);
}

.pl-label {
  font-family: var(--sans);
  font-weight: var(--w-med);
  font-size: var(--fs-label);
  letter-spacing: var(--track-label);
  text-transform: uppercase;
  color: var(--ink-muted);
}

.pl-body {
  font-family: var(--sans);
  font-weight: var(--w-reg);
  font-size: var(--fs-body);
  line-height: 1.6;
  color: var(--ink);
}

.pl-body-light {
  font-family: var(--sans);
  font-weight: var(--w-light);
  font-size: var(--fs-body-lg);
  line-height: 1.75;
  color: var(--ink-muted);
}

.pl-small {
  font-family: var(--sans);
  font-size: var(--fs-small);
  line-height: 1.6;
  color: var(--ink-muted);
}

/* ============================================================
   PLANYET — Landing page styles
   Direction: "Poster" — Oswald uppercase + Hanken Grotesk
   Type + colour driven, no photography.
   ============================================================ */

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{
  background:var(--cream);
  font-family:var(--sans);
  color:var(--ink);
  overflow-x:hidden;
  line-height:1.6;
}
::selection{background:var(--red);color:#fff}
a{color:inherit;text-decoration:none}
img{display:block}

.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(24px,5vw,64px)}

/* ---------- shared type helpers ---------- */
.eyebrow{
  font-family:var(--sans);font-weight:var(--w-med);
  font-size:var(--fs-label);letter-spacing:var(--track-eyebrow);
  text-transform:uppercase;color:var(--red);
  display:inline-flex;align-items:center;gap:9px;white-space:nowrap;
}
.eyebrow::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--red);flex-shrink:0}
.eyebrow.on-red{color:#fff}
.eyebrow.on-red::before{background:#fff}

.poster{
  font-family:var(--display);font-weight:700;text-transform:uppercase;
  line-height:.94;letter-spacing:.005em;color:var(--ink);
  text-wrap:balance;
}
.poster .hot{color:var(--red)}
.on-red .poster,.poster.on-red{color:#fff}
.on-red .poster .hot{color:var(--cream)}

.lede{font-size:var(--fs-body-lg);font-weight:var(--w-light);color:var(--ink-muted);line-height:1.7;text-wrap:pretty}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:9px;
  font-family:var(--sans);font-weight:var(--w-med);font-size:15px;letter-spacing:.02em;
  padding:14px 24px;border-radius:var(--r-sm);cursor:pointer;border:1.5px solid transparent;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease),
             border-color var(--dur) var(--ease),transform var(--dur-fast) var(--ease);
  white-space:nowrap;
}
.btn svg{transition:transform var(--dur) var(--ease)}
.btn:hover svg{transform:translateX(3px)}
.btn-primary{background:var(--red);color:#fff}
.btn-primary:hover{background:var(--red-dark);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line-input)}
.btn-ghost:hover{border-color:var(--red);color:var(--red)}
.on-red .btn-ghost,.btn-ghost.on-red{color:#fff;border-color:rgba(255,255,255,.45)}
.on-red .btn-ghost:hover,.btn-ghost.on-red:hover{background:#fff;color:var(--red);border-color:#fff}
.btn-white{background:#fff;color:var(--red)}
.btn-white:hover{background:var(--cream);transform:translateY(-1px)}

/* ============================================================
   NAV
   ============================================================ */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:50;
  transition:background var(--dur) var(--ease),box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease);
  border-bottom:1px solid transparent;
}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:74px}
.nav.scrolled{background:rgba(245,241,230,.86);backdrop-filter:blur(12px);border-bottom-color:var(--line)}
.nav-logo{height:120
   0px;width:auto}
.nav-links{display:flex;align-items:center;gap:34px}
.nav-links a{font-size:14px;font-weight:var(--w-med);color:var(--ink-mid);letter-spacing:.01em;transition:color var(--dur) var(--ease)}
.nav-links a:hover{color:var(--red)}
.nav-cta{padding:10px 20px;font-size:14px}
.nav-menu-btn{display:none;background:none;border:none;cursor:pointer;color:var(--ink)}
@media(max-width:780px){
  .nav-links{display:none}
}

/* ============================================================
   HERO
   ============================================================ */
.hero{position:relative;overflow:hidden;padding:148px 0 0;min-height:100vh;display:flex;flex-direction:column}
.hero-inner{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:36px}
.hero-eyebrow{margin-bottom:26px}
.hero-title{font-size:clamp(58px,11.5vw,168px);margin-bottom:30px}
.hero-sub{max-width:520px;font-size:clamp(16px,1.6vw,20px);margin-bottom:38px}
.hero-actions{display:flex;flex-wrap:wrap;gap:14px}

/* experience marquee */
.marquee{
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:18px 0;overflow:hidden;white-space:nowrap;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);
          mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);
}
.marquee-track{display:inline-flex;gap:0;animation:scrollX 38s linear infinite}
.marquee-item{
  font-family:var(--display);font-weight:700;text-transform:uppercase;
  font-size:clamp(20px,2.4vw,30px);letter-spacing:.02em;color:var(--ink);
  padding:0 26px;display:inline-flex;align-items:center;gap:26px;
}
.marquee-item::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--red);flex-shrink:0}
@keyframes scrollX{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.marquee-track{animation:none}}

/* hero theme: CREAM (default) */
.hero--cream{background:var(--cream)}

/* hero theme: RED full bleed */
.hero--red{background:var(--red)}
.hero--red .hero-title{color:#fff}
.hero--red .hero-title .hot{color:var(--cream)}
.hero--red .hero-sub{color:rgba(255,255,255,.8)}
.hero--red .eyebrow{color:#fff}
.hero--red .eyebrow::before{background:#fff}
.hero--red .marquee{border-color:rgba(255,255,255,.22)}
.hero--red .marquee-item{color:#fff}
.hero--red .marquee-item::after{background:rgba(255,255,255,.65)}
.hero--red .btn-ghost{color:#fff;border-color:rgba(255,255,255,.45)}
.hero--red .btn-ghost:hover{background:#fff;color:var(--red);border-color:#fff}
.hero--red .btn-primary{background:#fff;color:var(--red)}
.hero--red .btn-primary:hover{background:var(--cream)}
.hero--red .hero-oval{border-color:rgba(255,255,255,.10)}

/* hero theme: SPLIT */
.hero--split .hero-inner{
  display:grid;grid-template-columns:0.9fr 1.1fr;gap:clamp(32px,5vw,72px);align-items:center;
  padding-top:0;
}
.hero--split .hero-mark{
  align-self:stretch;background:var(--red);border-radius:var(--r-lg);
  display:flex;align-items:center;justify-content:center;padding:48px;min-height:60vh;position:relative;overflow:hidden;
}
.hero--split .hero-mark img{height:clamp(72px,12vw,150px);width:auto;filter:brightness(0) invert(1);position:relative;z-index:1}
.hero--split .hero-copy{display:flex;flex-direction:column;justify-content:center}
.hero-mark{display:none}
.hero--split .hero-mark{display:flex}
.hero--split .hero-title{font-size:clamp(46px,6.6vw,104px)}

/* decorative oval inside split mark (reads as logo backdrop, single, subtle) */
.hero-oval{position:absolute;width:150%;height:60%;border:60px solid rgba(255,255,255,.07);border-radius:50%;transform:rotate(-16deg);pointer-events:none}

@media(max-width:860px){
  .hero{padding-top:120px;min-height:auto}
  .hero--split .hero-inner{grid-template-columns:1fr}
  .hero--split .hero-mark{min-height:240px;order:-1}
  .hero--split .hero-title{font-size:clamp(46px,13vw,84px)}
}

/* ============================================================
   PROCESS / HOW IT WORKS
   ============================================================ */
.process{background:var(--cream);padding:clamp(80px,11vw,150px) 0}
.section-head{max-width:760px;margin-bottom:clamp(48px,6vw,84px)}
.section-head .eyebrow{margin-bottom:22px}
.section-head h2{font-size:clamp(40px,6vw,86px)}
.section-head p{margin-top:22px;max-width:560px}

.steps{display:grid;gap:0;border-top:1px solid var(--line)}
.step{
  display:grid;grid-template-columns:140px 1fr;gap:clamp(20px,4vw,56px);
  align-items:start;padding:clamp(28px,4vw,46px) 0;border-bottom:1px solid var(--line);
  transition:background var(--dur) var(--ease);
}
.step:hover{background:rgba(232,71,63,.035)}
.step-num{
  font-family:var(--display);font-weight:700;font-size:clamp(48px,6vw,88px);
  line-height:.8;color:var(--red);letter-spacing:.01em;
}
.step-body h3{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(22px,2.6vw,34px);line-height:1.02;color:var(--ink);margin-bottom:12px;letter-spacing:.01em}
.step-body p{font-size:var(--fs-body-lg);color:var(--ink-muted);max-width:480px;font-weight:var(--w-light);line-height:1.7}
@media(max-width:680px){
  .step{grid-template-columns:1fr;gap:10px}
  .step-num{font-size:52px}
}

/* ============================================================
   ABOUT (red full-bleed statement)
   ============================================================ */
.about{background:var(--red);color:#fff;padding:clamp(84px,12vw,160px) 0;position:relative;overflow:hidden}
.about .eyebrow{margin-bottom:30px}
.about-statement{
  font-family:var(--display);font-weight:700;text-transform:uppercase;
  font-size:clamp(34px,5.4vw,80px);line-height:.98;letter-spacing:.005em;
  max-width:16ch;margin-bottom:42px;text-wrap:balance;
}
.about-statement .soft{color:var(--cream);opacity:.62}
.about-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(32px,6vw,90px);align-items:start;border-top:1px solid rgba(255,255,255,.22);padding-top:48px}
.about-grid p{font-size:var(--fs-body-lg);line-height:1.8;color:rgba(255,255,255,.82);font-weight:var(--w-light);max-width:46ch}
.about-grid p + p{margin-top:20px}
.about-what .pl-label{color:rgba(255,255,255,.6);display:block;margin-bottom:18px;letter-spacing:var(--track-eyebrow)}
.what-list{display:flex;flex-direction:column}
.what-list li{
  list-style:none;font-family:var(--display);font-weight:700;text-transform:uppercase;
  font-size:clamp(18px,2vw,26px);letter-spacing:.01em;color:#fff;
  padding:13px 0;border-bottom:1px solid rgba(255,255,255,.16);
  display:flex;align-items:center;gap:14px;transition:padding-left var(--dur) var(--ease),color var(--dur) var(--ease);
}
.what-list li::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--cream);flex-shrink:0;opacity:.7}
.what-list li:hover{padding-left:8px;color:var(--cream)}
@media(max-width:760px){.about-grid{grid-template-columns:1fr;gap:44px}}

/* ============================================================
   ENQUIRY (contact split)
   ============================================================ */
.enquiry{background:var(--cream);padding:clamp(70px,9vw,120px) 0}
.enquiry-card{
  display:grid;grid-template-columns:0.92fr 1.08fr;
  border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);
  box-shadow:var(--shadow-soft);background:#fff;
}
.enq-left{background:var(--red);color:#fff;padding:clamp(40px,4.5vw,60px);position:relative;overflow:hidden;display:flex;flex-direction:column}
.enq-left .eyebrow{margin-bottom:24px}
.enq-left h2{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(36px,4.4vw,62px);line-height:.96;letter-spacing:.01em;margin-bottom:20px}
.enq-left p{font-size:var(--fs-body-lg);color:rgba(255,255,255,.82);font-weight:var(--w-light);line-height:1.7;max-width:34ch}
.enq-left-foot{margin-top:auto;padding-top:40px;display:flex;flex-direction:column;gap:6px}
.enq-left-foot a{font-size:14px;color:rgba(255,255,255,.78);transition:color var(--dur) var(--ease)}
.enq-left-foot a:hover{color:#fff}
.enq-oval{position:absolute;width:130%;height:55%;bottom:-10%;right:-30%;border:54px solid rgba(255,255,255,.08);border-radius:50%;transform:rotate(-14deg);pointer-events:none}

.enq-right{padding:clamp(36px,4vw,52px);display:flex;flex-direction:column;justify-content:center;background:#fff}
.pl-field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.pl-field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.pl-field label{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
.pl-field input{padding:13px 16px;border:1.5px solid var(--line-input);border-radius:var(--r-sm);font-family:var(--sans);font-size:15px;background:var(--cream);color:var(--ink);outline:none;transition:border-color var(--dur),background var(--dur);width:100%}
.pl-field input::placeholder{color:var(--placeholder)}
.pl-field input:focus{border-color:var(--red);background:#fff}

.pl-dd-wrap{position:relative}
.pl-dd-btn{width:100%;padding:13px 16px;border:1.5px solid var(--line-input);border-radius:var(--r-sm);font-family:var(--sans);font-size:15px;outline:none;cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;transition:border-color var(--dur),background var(--dur)}
.pl-dd-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1.5px solid var(--line-input);border-radius:var(--r-md);overflow-y:auto;max-height:248px;z-index:20;box-shadow:0 12px 32px rgba(26,20,16,.12)}
.pl-dd-opt{padding:11px 16px;font-size:14px;color:var(--ink-muted);cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .12s,color .12s}
.pl-dd-opt:hover{background:var(--cream);color:var(--ink)}
.pl-dd-opt.sel{color:var(--red);background:var(--red-pale)}
.pl-dd-dot{width:6px;height:6px;border-radius:50%;background:var(--line-input);flex-shrink:0;transition:background .12s}
.pl-dd-opt:hover .pl-dd-dot,.pl-dd-opt.sel .pl-dd-dot{background:var(--red)}

.pl-submit{width:100%;padding:15px;background:var(--red);color:#fff;border:none;border-radius:var(--r-sm);font-family:var(--sans);font-size:16px;font-weight:500;cursor:pointer;margin-top:8px;transition:background var(--dur),transform var(--dur-fast);letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:8px}
.pl-submit:hover{background:var(--red-dark);transform:translateY(-1px)}
.pl-submit:active{transform:translateY(0)}
.pl-submit-arrow{transition:transform var(--dur)}
.pl-submit:hover .pl-submit-arrow{transform:translateX(3px)}
.pl-form-note{font-size:12px;color:var(--ink-muted);text-align:center;margin-top:16px;line-height:1.5}

.pl-success{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:36px 12px}
.pl-success-ring{width:62px;height:62px;border-radius:50%;background:var(--red-pale);display:flex;align-items:center;justify-content:center}
.pl-success h3{font-family:var(--display);text-transform:uppercase;font-size:32px;font-weight:700;letter-spacing:.01em;color:var(--ink)}
.pl-success p{font-size:15px;color:var(--ink-muted);line-height:1.7;max-width:320px}

@media(max-width:780px){
  .enquiry-card{grid-template-columns:1fr}
  .pl-field-row{grid-template-columns:1fr}
}

/* ============================================================
   FOOTER
   ============================================================ */
.footer{background:var(--ink);color:#fff;padding:clamp(54px,7vw,84px) 0 40px}
.footer-top{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;flex-wrap:wrap;padding-bottom:48px;border-bottom:1px solid rgba(255,255,255,.12)}
.footer-logo{height:120px;width:auto;filter:brightness(0) invert(1);margin-bottom:18px}
.footer-tag{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(26px,3.4vw,46px);line-height:1;letter-spacing:.01em;max-width:14ch}
.footer-tag .hot{color:var(--red)}
.footer-links{display:flex;gap:48px;flex-wrap:wrap}
.footer-col{display:flex;flex-direction:column;gap:12px}
.footer-col .pl-label{color:rgba(255,255,255,.4);letter-spacing:var(--track-eyebrow);margin-bottom:4px;font-size:11px;text-transform:uppercase;font-weight:500}
.footer-col a{font-size:15px;color:rgba(255,255,255,.78);transition:color var(--dur) var(--ease)}
.footer-col a:hover{color:var(--red)}
.footer-bottom{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-top:28px;font-size:13px;color:rgba(255,255,255,.5)}
.footer-bottom a{color:rgba(255,255,255,.5)}
.footer-bottom a:hover{color:#fff}

/* ---------- reveal-on-scroll ---------- */
.reveal{opacity:0;transform:translateY(20px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){.reveal{opacity:1!important;transform:none!important}}

</style>

<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel">
/* Planyet — shared icons */
function ArrowIcon({ className }) {
  return (
    <svg className={className} width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}
function ChevronIcon({ open }) {
  return (
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"
         style={{ transition: 'transform .2s', transform: open ? 'rotate(180deg)' : 'none', flexShrink: 0 }}>
      <path d="M4 6l4 4 4-4" stroke="#8a7570" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}
function CheckIcon() {
  return (
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
      <circle cx="13" cy="13" r="11" stroke="#E8473F" strokeWidth="1.6"/>
      <path d="M8.5 13l3.5 3.5 6-7" stroke="#E8473F" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

/* reveal-on-scroll hook — scroll/rect based (IntersectionObserver is unreliable in some embeds) */
function useReveal() {
  React.useEffect(() => {
    let ticking = false;
    function check() {
      ticking = false;
      const vh = window.innerHeight || document.documentElement.clientHeight;
      document.querySelectorAll('.reveal:not(.in)').forEach(el => {
        const r = el.getBoundingClientRect();
        if (r.top < vh * 0.92 && r.bottom > 0) el.classList.add('in');
      });
    }
    function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(check); } }
    // initial passes (cover async layout / font load)
    check();
    requestAnimationFrame(check);
    const t = setTimeout(check, 300);
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    return () => { clearTimeout(t); window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', onScroll); };
  }, []);
}

function scrollToId(id) {
  const el = document.getElementById(id);
  if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 64, behavior: 'smooth' });
}

Object.assign(window, { ArrowIcon, ChevronIcon, CheckIcon, useReveal, scrollToId });

</script>

<script type="text/babel">
/* Planyet — sticky top navigation */
function Nav() {
  const [scrolled, setScrolled] = React.useState(false);
  React.useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 24);
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  return (
    <nav className={'nav' + (scrolled ? ' scrolled' : '')}>

<script type="text/babel">
/* Planyet — How it works / process */
const STEPS = [
  { n: '01', t: 'Tell us your moment', d: "Share what you're dreaming of — a quiet dinner, a proposal, a milestone with friends. A few words is all we need to begin." },
  { n: '02', t: 'We design it', d: 'Our studio shapes every detail into a single, considered experience — the place, the timing, the small touches that make it yours.' },
  { n: '03', t: 'We handle everything', d: 'Bookings, setup, surprises, logistics. We step in before the moment happens so nothing falls on you.' },
  { n: '04', t: 'You just feel it', d: 'On the day, all you have to do is show up and be present. We hold everything else in the background.' },
];

function Process() {
  return (
    <section className="process" id="process">
      <div className="wrap">
        <div className="section-head reveal">
          <span className="eyebrow">How it works</span>
          <h2 className="poster">You dream it.<br /><span className="hot">We design it.</span></h2>
          <p className="lede">Planning is ours to carry. From the first idea to the final detail, we make sure the moment lands exactly as you imagined — and you never see the work behind it.</p>
        </div>
        <div className="steps">
          {STEPS.map((s, i) => (
            <div className="step reveal" key={s.n} style={{ transitionDelay: (i * 70) + 'ms' }}>
              <div className="step-num">{s.n}</div>
              <div className="step-body">
                <h3>{s.t}</h3>
                <p>{s.d}</p>
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}
Object.assign(window, { Process });

</script>

<script type="text/babel">
/* Planyet — experience selector dropdown */
function Dropdown({ value, onChange, error }) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  const options = [
    'Romantic date', 'Anniversary celebration', 'Proposal setup',
    'Bachelor / bachelorette party', 'Birthday celebration',
    'Friends get-together', 'Corporate event', 'Other'
  ];
  React.useEffect(() => {
    function onDoc(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener('click', onDoc);
    return () => document.removeEventListener('click', onDoc);
  }, []);
  const borderColor = error ? 'var(--red)' : (open ? 'var(--red)' : 'var(--line-input)');
  return (
    <div className="pl-dd-wrap" ref={ref}>
      <button type="button" className="pl-dd-btn"
              style={{ borderColor, background: open ? '#fff' : 'var(--cream)',
                       color: value ? 'var(--ink)' : 'var(--placeholder)' }}
              onClick={() => setOpen(o => !o)}>
        <span>{value || 'Select an experience'}</span>
        <ChevronIcon open={open} />
      </button>
      {open && (
        <div className="pl-dd-menu">
          {options.map(opt => (
            <div key={opt} className={'pl-dd-opt' + (opt === value ? ' sel' : '')}
                 onClick={() => { onChange(opt); setOpen(false); }}>
              <span className="pl-dd-dot"></span>{opt}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}
Object.assign(window, { Dropdown });

</script>

<script type="text/babel">
/* Planyet — Enquiry (contact split card) with validation + success */
function Enquiry() {
  const [name, setName] = React.useState('');
  const [phone, setPhone] = React.useState('');
  const [exp, setExp] = React.useState('');
  const [sent, setSent] = React.useState(false);
  const [sending, setSending] = React.useState(false);
  const [err, setErr] = React.useState({});

  function submit() {
    const e = { name: !name.trim(), phone: !(phone.length === 10 && /^\d+$/.test(phone)), exp: !exp };
    setErr(e);
    if (e.name || e.phone || e.exp) return;
    setSending(true);
    setTimeout(() => { setSending(false); setSent(true); }, 800);
  }

  return (
    <section className="enquiry" id="enquiry">
      <div className="wrap">
        <div className="enquiry-card reveal">
          <div className="enq-left">
            <div className="enq-oval"></div>
            <span className="eyebrow on-red">Get in touch</span>
            <h2>Make your<br />moment happen</h2>
            <p>Tell us what you're dreaming of. We'll handle everything from there.</p>
            <div className="enq-left-foot">
              <a href="mailto:mail@planyet.in">mail@planyet.in</a>
              <a href="https://www.instagram.com/plan.yet" target="_blank" rel="noopener">Instagram · @plan.yet</a>
            </div>
          </div>

          <div className="enq-right">
            {!sent ? (
              <React.Fragment>
                <div className="pl-field-row">
                  <div className="pl-field">
                    <label>Your name</label>
                    <input type="text" placeholder="e.g. Rohan" value={name}
                           style={{ borderColor: err.name ? 'var(--red)' : undefined }}
                           onChange={e => setName(e.target.value)} />
                  </div>
                  <div className="pl-field">
                    <label>Mobile number</label>
                    <input type="tel" placeholder="9876543210" maxLength="10" value={phone}
                           style={{ borderColor: err.phone ? 'var(--red)' : undefined }}
                           onChange={e => setPhone(e.target.value.replace(/\D/g, ''))} />
                  </div>
                </div>
                <div className="pl-field">
                  <label>Experience type</label>
                  <Dropdown value={exp} onChange={setExp} error={err.exp} />
                </div>
                <button className="pl-submit" onClick={submit} disabled={sending}
                        style={{ opacity: sending ? 0.7 : 1 }}>
                  {sending ? 'Sending…' : <React.Fragment>Send enquiry <ArrowIcon className="pl-submit-arrow" /></React.Fragment>}
                </button>
                <p className="pl-form-note">We usually reply within a day. No spam, ever.</p>
              </React.Fragment>
            ) : (
              <div className="pl-success">
                <div className="pl-success-ring"><CheckIcon /></div>
                <h3>We'll be in touch!</h3>
                <p>Thanks for reaching out. Our team will contact you shortly to plan your perfect experience.</p>
              </div>
            )}
          </div>
        </div>
      </div>
    </section>
  );
}
Object.assign(window, { Enquiry });

</script>
