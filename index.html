<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planyet | Coming Soon</title>
    <style>
        /* Modern Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff; /* Pure white background */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
            padding: 24px;
        }

        /* 🌀 MINIMALIST LOADING SCREEN */
        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 2px solid #f1f5f9;
            border-radius: 50%;
            border-top-color: #f9363B; /* Accent spinning segment matched to brand red */
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* 🧱 CONTENT LAYOUT */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 460px; /* Perfectly sized to fit your dual-tone headline beautifully */
            width: 100%;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 🔳 RECTANGULAR LOGO CONFIGURATION (642x321 optimized) */
        .logo-wrapper {
            width: 100%;
            max-width: 320px; /* Refined desktop width for clear landscape presentation */
            aspect-ratio: 642 / 321; /* Keeps your 2:1 rectangle perfectly proportioned */
            margin-bottom: 36px;
            display: flex;
            justify-content: center;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 🏷️ STATUS BADGE */
        .status-badge {
            background-color: #f1f5f9;
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #475569;
            margin-bottom: 24px;
            font-weight: 600;
        }

        /* ✍️ TYPOGRAPHY & PREMIUM PALETTE COLORING */
        h1 {
            font-size: 1.85rem;
            font-weight: 500; /* Regular weight for elegant prose contrast */
            letter-spacing: -0.02em;
            color: #4f3535; /* Custom deep dark muted earth tone */
            margin-bottom: 16px;
            line-height: 1.35;
        }

        p {
            font-size: 0.95rem;
            color: #4f3535; /* Matching custom muted base tone */
            opacity: 0.9;
            line-height: 1.6;
            max-width: 360px;
        }

        /* Inline brand highlighting style rules */
        .brand-highlight {
            font-weight: 700; /* Distinctly bold */
            color: #f9363B;   /* Vibrant brand red color */
        }

        /* 📱 MOBILE RESPONSIVE TWEAKS */
        @media (max-width: 768px) {
            .logo-wrapper {
                max-width: 240px; /* Scaled down clean for mobile layouts */
                margin-bottom: 28px;
            }
            h1 {
                font-size: 1.55rem;
            }
            p {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div id="loader-wrapper">
        <div class="spinner"></div>
    </div>

    <div class="container">
        <div class="status-badge">Under Construction</div>
        
        <div class="logo-wrapper">
            <img src="planyet-logosquare" alt="Planyet Logo" width="642" height="321">
        </div>

        <h1>You have a <span class="brand-highlight">Plan</span>. <span class="brand-highlight">Yet</span>, the best is unwritten.</h1>
        <p>We’re reimagining the blank space between them. Hold tight.</p>
    </div>

    <script>
        window.addEventListener('load', function() {
            const loader = document.getElementById('loader-wrapper');
            setTimeout(() => {
                loader.classList.add('fade-out');
            }, 350);
        });
    </script>

</body>
</html>
