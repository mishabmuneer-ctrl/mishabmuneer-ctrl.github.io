<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlanYet | The Plan is Loading...</title>
    
    <link rel="icon" type="image/png" href="planyet-flogosquare">

    <style>
        /* Modern Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff; /* Pure white background */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
            padding: 24px;
        }

        /* 🌀 MINIMALIST LOADING SCREEN */
        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 2px solid #f1f5f9;
            border-radius: 50%;
            border-top-color: #f9363B; /* Accent spinning segment matched to brand red */
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* 🧱 CONTENT LAYOUT */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 700px; /* Expanded layout boundary to perfectly hold single-line text elements */
            width: 100%;
            animation: fadeInUp 0.8s ease-out;
            margin-top: -12vh; /* Shifts layout upward to balance vertical space */
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 🔳 RECTANGULAR LOGO CONFIGURATION (642x321 optimized & Zoomed In) */
        .logo-wrapper {
            width: 100%;
            max-width: 420px; /* Zoomed in for bold screen presence and brand impact */
            aspect-ratio: 642 / 321; /* Keeps your 2:1 rectangle perfectly proportioned */
            margin-bottom: 36px;
            display: flex;
            justify-content: center;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 🏷️ STATUS BADGE */
        .status-badge {
            background-color: #f1f5f9;
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            color: #475569;
            margin-bottom: 24px;
            font-weight: 600;
        }

        /* ✍️ TYPOGRAPHY & PREMIUM PALETTE COLORING */
        h1 {
            font-size: 1.85rem;
            font-weight: 500; /* Regular weight for elegant prose contrast */
            letter-spacing: -0.02em;
            color: #4f3535; /* Custom deep dark muted earth tone */
            margin-bottom: 16px;
            white-space: nowrap; /* Forces the entire headline onto a single elegant line */
        }

        p {
            font-size: 0.95rem;
            color: #4f3535; /* Matching custom muted base tone */
            opacity: 0.9;
            line-height: 1.6;
            max-width: 100%; /* Removes previous restrictions to allow full width display */
            white-space: nowrap; /* Forces the body text onto a single elegant line on desktop screens */
        }

        /* Inline brand highlighting style rules */
        .brand-highlight {
            font-weight: 700; /* Distinctly bold */
            color: #f9363B;   /* Vibrant brand red color */
        }

        /* 📱 MOBILE RESPONSIVE TWEAKS */
        @media (max-width: 768px) {
            .container {
                margin-top: -8vh; /* Adjusted vertical pull specifically for mobile viewport sizing */
            }
            .logo-wrapper {
                max-width: 300px; /* Zoomed in proportionally for mobile viewports */
                margin-bottom: 28px;
            }
            h1 {
                font-size: 1.15rem; /* Scaled down perfectly to prevent text wrapping on smaller devices */
                letter-spacing: -0.01em;
                white-space: normal; /* Safely allows text wrapping on small screens to avoid horizontal overflow */
            }
            p {
                font-size: 0.85rem;
                white-space: normal; /* Safely allows text wrapping on small screens to avoid horizontal overflow */
                max-width: 290px;
            }
        }
    </style>
</head>
<body>

    <div id="loader-wrapper">
        <div class="spinner"></div>
    </div>

    <div class="container">
        <div class="status-badge">THE <span style="color: #f9363B; font-weight: 700;">PLAN</span> IS LOADING</div>
        
        <div class="logo-wrapper">
            <img src="planyet-flogo19971075" alt="Planyet Logo" width="642" height="321">
        </div>

        <h1>You have a <span class="brand-highlight">Plan</span><span class="brand-highlight">Yet</span> the best is unwritten.</h1>
        <p>Helping you make every single moment truly memorable.</p>
    </div>

    <script>
        window.addEventListener('load', function() {
            const loader = document.getElementById('loader-wrapper');
            setTimeout(() => {
                loader.classList.add('fade-out');
            }, 350);
        });
    </script>

</body>
</html>
